<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prática 6</title>
</head>
<body>
    <h1>Prática JavaScript 6 - Solicitar até 0</h1>

    <script>
        let numero

        while (numero != 0) {
            numero = Number(prompt("Digite um número (ou 0 para sair):"));
            if (numero % 2 == 0) {
                alert(numero + " é par.");  
            } else {
                alert(numero + " é impar.");
            }       
        }
    </script>
</body>
</html>
