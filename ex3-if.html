<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prática 3</title>
</head>
<body>
    <h1>Prática JavaScript 3 - if</h1>

    <script>
        const idade = Number(prompt("Digite sua idade"));

        if (idade < 16) {
            alert("Não pode votar");
        } else if (idade <= 17){
            alert("Voto opcional.");
        } else {
            alert("Voto obrigatório.");
        }
    </script>
</body>
</html>
