<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prática 2</title>
</head>
<body>
    <h1>Prática JavaScript 2</h1>

    <script>
        const nome = prompt("Digite seu nome");
        let idade = Number(prompt("Digite sua idade"));
        let curso = prompt("Digite seu curso");

        console.log("Olá, meu nome é " + nome + ", tenho " + idade + " anos e estou cursando" + curso + ".");

        console.log("Daqui a 5 anos, o aluno " + nome + " terá " + (idade + 5) + " anos.");
    </script>
</body>
</html>
